[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
jieba-rs = { version = "0.11", default-features = false, features = ["default-dict"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

memory-core = { path = "crates/memory-core" }
memory-engine = { path = "crates/memory-engine" }
memory-ingest = { path = "crates/memory-ingest" }
memory-llm = { path = "crates/memory-llm" }
memory-mcp = { path = "crates/memory-mcp" }
memory-store = { path = "crates/memory-store" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
